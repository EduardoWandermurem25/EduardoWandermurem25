<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="Progresso de estudos" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE766"/>
      <stop offset="1" stop-color="#FFB300"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="798" height="358" rx="16" fill="#0D0D0D" stroke="#FFD600" stroke-opacity="0.35"/>

  <text x="30" y="46" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#FFD600">Progresso de estudos</text>
  <line x1="30" y1="62" x2="770" y2="62" stroke="#FFFFFF" stroke-opacity="0.12"/>

  <g font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#FFFFFF">

    <!-- C# -->
    <text x="30" y="100">C#</text>
    <rect x="170" y="88" width="400" height="12" rx="6" fill="#222222"/>
    <rect x="170" y="88" width="0" height="12" rx="6" fill="url(#gold)"><animate attributeName="width" from="0" to="240" dur="1.2s" fill="freeze"/></rect>
    <text x="585" y="100" font-weight="700" fill="#FFD600">60%</text>
    <text x="640" y="100" font-size="13" fill="#AAAAAA">Praticando</text>

    <!-- Unity -->
    <text x="30" y="146">Unity</text>
    <rect x="170" y="134" width="400" height="12" rx="6" fill="#222222"/>
    <rect x="170" y="134" width="0" height="12" rx="6" fill="url(#gold)"><animate attributeName="width" from="0" to="160" dur="1.2s" begin="0.15s" fill="freeze"/></rect>
    <text x="585" y="146" font-weight="700" fill="#FFD600">40%</text>
    <text x="640" y="146" font-size="13" fill="#AAAAAA">Aprendendo</text>

    <!-- Git e GitHub -->
    <text x="30" y="192">Git e GitHub</text>
    <rect x="170" y="180" width="400" height="12" rx="6" fill="#222222"/>
    <rect x="170" y="180" width="0" height="12" rx="6" fill="url(#gold)"><animate attributeName="width" from="0" to="160" dur="1.2s" begin="0.3s" fill="freeze"/></rect>
    <text x="585" y="192" font-weight="700" fill="#FFD600">40%</text>
    <text x="640" y="192" font-size="13" fill="#AAAAAA">Aprendendo</text>

    <!-- HTML -->
    <text x="30" y="238">HTML</text>
    <rect x="170" y="226" width="400" height="12" rx="6" fill="#222222"/>
    <text x="585" y="238" font-weight="700" fill="#777777">0%</text>
    <text x="640" y="238" font-size="13" fill="#AAAAAA">Próximo passo</text>

    <!-- CSS -->
    <text x="30" y="284">CSS</text>
    <rect x="170" y="272" width="400" height="12" rx="6" fill="#222222"/>
    <text x="585" y="284" font-weight="700" fill="#777777">0%</text>
    <text x="640" y="284" font-size="13" fill="#AAAAAA">Em breve</text>

    <!-- JavaScript -->
    <text x="30" y="330">JavaScript</text>
    <rect x="170" y="318" width="400" height="12" rx="6" fill="#222222"/>
    <text x="585" y="330" font-weight="700" fill="#777777">0%</text>
    <text x="640" y="330" font-size="13" fill="#AAAAAA">Em breve</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
