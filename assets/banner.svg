<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Banner do Eduardo: aventura no código" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D0D0D"/>
      <stop offset="1" stop-color="#2E2300"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD600" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFD600" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF08A"/>
      <stop offset="0.5" stop-color="#FFD600"/>
      <stop offset="1" stop-color="#FFA800"/>
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="1000" height="300" fill="url(#bg)"/>

  <!-- Sol brilhante -->
  <circle cx="830" cy="125" r="170" fill="url(#glow)"/>
  <circle cx="830" cy="125" r="56" fill="#FFD600">
    <animate attributeName="r" values="56;60;56" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="830" cy="125" r="56" fill="none" stroke="#FFF08A" stroke-width="3" opacity="0.6">
    <animate attributeName="r" values="62;84;62" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Estrelas piscando -->
  <g fill="#FFF08A">
    <circle cx="80" cy="40" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="85" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="30" r="2.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="70" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="35" r="2"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="90" r="1.8"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="40" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="215" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Colinas -->
  <path d="M0 238 Q 150 190 310 232 T 620 224 T 1000 226 V300 H0 Z" fill="#4A3A00"/>
  <path d="M0 268 Q 210 226 410 264 T 810 256 T 1000 264 V300 H0 Z" fill="#1A1400"/>

  <!-- Detalhe: tag superior -->
  <text x="60" y="62" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="700" fill="#FFD600" letter-spacing="5">C#  •  UNITY  •  FRONT-END</text>

  <!-- Título -->
  <text x="56" y="152" font-family="'Courier New', Courier, monospace" font-size="86" font-weight="900" fill="url(#gold)" stroke="#000000" stroke-width="2" letter-spacing="6">EDUARDO</text>

  <!-- Subtítulo -->
  <text x="60" y="192" font-family="'Courier New', Courier, monospace" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="7">AVENTURA NO CÓDIGO</text>

  <!-- Linha que estica e volta -->
  <path d="M60 220 Q 200 220 340 220" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round">
    <animate attributeName="d" dur="4s" repeatCount="indefinite"
      values="M60 220 Q 200 220 340 220;M60 220 Q 330 190 640 220;M60 220 Q 200 220 340 220"
      keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </path>

  <!-- Vidas estilo RPG -->
  <text x="780" y="62" font-family="'Courier New', Courier, monospace" font-size="24" fill="#FFD600" letter-spacing="6">♥ ♥ ♥
    <animate attributeName="opacity" values="1;0.55;1" dur="1.6s" repeatCount="indefinite"/>
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
